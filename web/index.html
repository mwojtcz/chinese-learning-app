<!DOCTYPE html>
<html lang="pl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chinese and Polish flashcards, HSK vocabulary, and grammar guides.">
  <meta name="theme-color" content="#182D32">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Polski · 中文">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/svg+xml" href="icons/brand-mark.svg">

  <title>Polski · 中文</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; min-height: 100%; background: #F6F2EB; color: #182D32; }
    #launch {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 32px 24px;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #launch img { width: 88px; height: 88px; }
    #launch h1 { margin: 24px 0 12px; font-size: clamp(24px, 6vw, 32px); font-weight: 500; letter-spacing: -.025em; }
    #launch p { margin: 0; max-width: 32ch; font-size: 15px; line-height: 1.6; color: #496057; }
    #launch button {
      margin-top: 24px; border: 1px solid #356D60; border-radius: 12px;
      padding: 12px 20px; background: #356D60; color: #FFF; font: inherit; cursor: pointer;
    }
    #launch button:focus-visible { outline: 3px solid #182D32; outline-offset: 4px; }
    #launch [hidden] { display: none; }
    /* The launch surface is intentionally static, including with reduced motion. */
  </style>
</head>
<body>
  <main id="launch" aria-labelledby="launch-title">
    <img src="icons/brand-mark.svg" alt="" width="88" height="88">
    <h1 id="launch-title">Polski · <span lang="zh-Hans">中文</span></h1>
    <p id="launch-status" role="status" aria-live="polite">Przygotowujemy Twoje miejsce do nauki.</p>
    <button id="launch-retry" type="button" hidden onclick="window.location.reload()">Spróbuj ponownie</button>
    <noscript><p>Włącz JavaScript w przeglądarce, aby rozpocząć naukę.</p></noscript>
  </main>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
